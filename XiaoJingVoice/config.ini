; ═══════════════════════════════════════════════════════
;  小鲸嗓子 · 轻量外壳配置
;
;  这个文件夹只有脚本和音色（1.6M），
;  引擎和模型在别处，由下面这几行指过去。
;
;  想换个地方用？只改 Root 一行就行。
; ═══════════════════════════════════════════════════════

; ---- 引擎和模型在哪 ----
Root = E:\BreezeTTS

; ---- 音色用哪份 ----
; 用外壳自带的（脚本旁边）：
Voices = %ScriptDir%\voices

; 也可以用主目录那份（二选一，取消下面注释）：
; Voices = E:\BreezeTTS\voices

; ---- 默认音色 ----
Voice = xiaojing_d3

; ---- ffmpeg（转码 + 音量归一化，必需）----
FFmpeg = E:\ComfyUI\tools\ffmpeg-9.0.2-essentials_build\bin\ffmpeg.exe

; ---- Seed-VC 唱歌引擎 ----
SeedVC = E:\seed-vc

; ---- 服务端口 ----
Port = 8137

; ---- 最小空闲显存（MiB）----
MinFreeMiB = 2600
